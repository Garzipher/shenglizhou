name: Deploy resume to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://garzipher.github.io/shenglizhou/
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Checkout independent GDRY resume
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gdry-project-manager
          path: .gdry-resume
          persist-credentials: false
      - name: Add GDRY page without changing the original website
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import shutil
          original = Path('site')
          before = {p.relative_to(original): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in original.rglob('*') if p.is_file()}
          branch = Path('.gdry-resume/site')
          pages = sorted(branch.glob('*-gdry.html'))
          assets = branch / 'variants/gdry'
          expected_pages = {'index-gdry.html', 'about-gdry.html', 'skills-gdry.html',
                            'projects-gdry.html', 'career-gdry.html', 'resume-gdry.html'}
          assert pages and {p.name for p in pages} <= expected_pages, 'Unexpected GDRY page'
          assert any(p.name == 'resume-gdry.html' for p in pages), 'GDRY resume missing'
          assert assets.is_dir(), 'GDRY assets missing'
          assert all(not (original / p.name).exists() for p in pages), 'GDRY pages must remain on their own branch'
          assert not (original / 'variants/gdry').exists(), 'GDRY assets must remain on their own branch'
          assert all(not p.is_symlink() for p in pages)
          for page in pages:
              shutil.copy2(page, original / page.name)
          for p in assets.rglob('*'):
              assert not p.is_symlink(), 'GDRY assets may not contain symbolic links'
              if p.is_file():
                  assert p.suffix in {'.css', '.woff2', '.pdf', '.docx'}, 'Unexpected GDRY asset'
          shutil.copytree(assets, original / 'variants/gdry')
          for name, digest in before.items():
              assert hashlib.sha256((original / name).read_bytes()).hexdigest() == digest, str(name)
          print('Original website unchanged:', len(before), 'files verified; GDRY page added.')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload static website only
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
